name: baranika

services:
  api:
    image: node:22
    working_dir: /app/server
    restart: on-failure
    labels:
      base44.project: "API"
      base44.kind: "api"
      base44.port: "8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
      - DB_PATH=/data/baranika.db
    env_file:
      - /run/base44/app.env
    volumes:
      - .:/app
      - server-node-modules:/app/server/node_modules
      - dbdata:/data
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund
        exec npx nodemon --watch src src/index.js
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    labels:
      base44.project: "Baranika"
      base44.kind: "web"
      base44.port: "3000"
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - API_PROXY_TARGET=http://api:8000
    volumes:
      - .:/app
      - web-node-modules:/app/node_modules
    command:
      - sh
      - -ec
      - |
        npm install --no-audit --no-fund
        exec npx vite --host 0.0.0.0 --port 5173 --strictPort
    ports:
      - "3000:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  dbdata:
  server-node-modules:
  web-node-modules:
